spring.application.name=HibernatePostloadBugExperiment

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=experiment
spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true
spring.flyway.schemas=${spring.jpa.properties.hibernate.default_schema}
spring.flyway.validate-migration-naming=true
spring.flyway.validate-on-migrate=true

spring.datasource.hikari.schema=${spring.jpa.properties.hibernate.default_schema}
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=postgres
